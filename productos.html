<!DOCTYPE html>
<html lang="es">
<head>

    <title>Catálogo - UrbanStyle</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        .btn-filter {
            background-color: #18181c;
            color: #ffffff;
            border: 1px solid #6a1b9a;
            padding: 8px 16px;
            font-weight: 600;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .btn-filter:hover, .btn-filter.active {
            background-color: #6a1b9a !important;
            color: #ffffff !important;
            border-color: #6a1b9a !important;
        }

        .product-card {
            background-color: #18181c;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .product-card:hover {
            transform: translateY(-4px);
            border-color: #d4af37;
        }

        .product-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 12px;
        }

        .price-tag {
            font-size: 1.25rem;
            font-weight: bold;
            color: #d4af37;
        }
    </style>
</head>

                <h2 class="fw-bold m-0" style="color: #d4af37;">PANTALONES</h2>

        <!-- 4. SECCIÓN ACCESORIOS -->
        <section class="mb-5 p-4 rounded" style="background-color: #18181c; border: 1px solid #6a1b9a;">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-center mb-4 gap-3">
                <h2 class="fw-bold m-0" style="color: #d4af37;">ACCESORIOS</h2>

                    <button type="button" class="btn btn-filter active" onclick="filtrarSeccion('accesorios', 'todos', this)">Todos</button>
                    <button type="button" class="btn btn-filter" onclick="filtrarSeccion('accesorios', 'hombre', this)">Hombre</button>

                    <button type="button" class="btn btn-filter" onclick="filtrarSeccion('accesorios', 'nino', this)">Niños</button>

            </div>
            <div class="row g-4" id="seccion-accesorios"></div>
        </section>

    </main>

    <footer class="text-center py-3 mt-auto border-top" style="background-color: #18181c; border-color: #333 !important;">
        <p class="m-0" style="color: #a0a0a0;">UrbanStyle Boutique &copy; 2026</p>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

            },

                id: 21,

                genero: "niño",

                imagen: "https://images.unsplash.com/photo-1519238263530-99bdd11df2ea?auto=format&fit=crop&w=600&q=80",

            },
            // ZAPATILLAS
            {
                id: 3,

                genero: "hombre",

            },
            {
                id: 30,
                nombre: "Zapatillas Air max 90",

            },

                precio: 59990,

            // ACCESORIOS
            {
                id: 4,

            },
            {
                id: 40,
                nombre: "Mochila Urban Gold",
                categoria: "accesorios",
                genero: "mujer",
                precio: 22990,
                imagen: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=600&q=80",
                descripcion: "Banano impermeable con compartimentos con cierre y correa dorada ajustable."
            },
            {
                id: 41,
                nombre: "Gorro Jordan",
                categoria: "accesorios",
                genero: "niño",
                precio: 12990,
                imagen: "jordan.jpg",
                descripcion: "jockey suave para niños con logo Jordan."
            }
        ];

        document.addEventListener("DOMContentLoaded", () => {
            const categorias = ['zapatillas', 'poleras-polerones', 'pantalones', 'accesorios'];
            categorias.forEach(cat => cargarProductosPorCategoria(cat, 'todos'));
            actualizarContadorCarrito();
        });

        function cargarProductosPorCategoria(categoria, genero) {
            const contenedor = document.getElementById(`seccion-${categoria}`);
            if (!contenedor) return;

            let filtrados = PRODUCTOS.filter(p => p.categoria === categoria);

            if (genero !== 'todos') {
                filtrados = filtrados.filter(p => p.genero === genero);
            }

            if (filtrados.length === 0) {
                contenedor.innerHTML = `<div class="col-12"><p class="text-center text-muted py-4 m-0">No hay productos disponibles para este género.</p></div>`;
                return;
            }

            contenedor.innerHTML = filtrados.map(p => `
                <div class="col-sm-6 col-md-4">
                    <div class="product-card">
                        <img src="${p.imagen}" alt="${p.nombre}">
                        <h5 class="fw-bold text-light mt-2">${p.nombre}</h5>
                        <p class="text-uppercase small m-0" style="color: #d4af37;">${p.genero}</p>
                        <p class="price-tag mb-3">$${p.precio.toLocaleString("es-CL")}</p>
                        <div class="d-flex gap-2">
                            <a href="producto-detalle.html?id=${p.id}" class="btn btn-outline-light btn-sm w-50 d-flex align-items-center justify-content-center">Ver</a>
                            <button onclick="agregarAlCarrito(${p.id})" class="btn btn-sm w-50 fw-bold" style="background-color: #d4af37; color: #000;">Añadir</button>
                        </div>
                    </div>
                </div>
            `).join("");
        }

        function filtrarSeccion(categoria, genero, boton) {
            if (boton) {
                const contenedorBotones = boton.parentElement;
                contenedorBotones.querySelectorAll('.btn-filter').forEach(btn => btn.classList.remove('active'));
                boton.classList.add('active');
            }
            cargarProductosPorCategoria(categoria, genero);
        }

        function agregarAlCarrito(idProducto) {
            let carrito = JSON.parse(localStorage.getItem("carrito_urbanstyle")) || [];
            const itemExistente = carrito.find(item => item.id === idProducto);

            if (itemExistente) {
                itemExistente.cantidad++;
            } else {
                const productoBase = PRODUCTOS.find(p => p.id === idProducto);
                if (productoBase) {
                    carrito.push({ ...productoBase, cantidad: 1 });
                }
            }

            localStorage.setItem("carrito_urbanstyle", JSON.stringify(carrito));
            actualizarContadorCarrito();
            alert("¡Producto añadido al carrito!");
        }

        function actualizarContadorCarrito() {
            const carrito = JSON.parse(localStorage.getItem("carrito_urbanstyle")) || [];
            const totalItems = carrito.reduce((sum, item) => sum + item.cantidad, 0);
            const badge = document.getElementById("cart-counter");
            if (badge) badge.textContent = totalItems;
        }
    </script>
