        <a class="navbar-brand" href="index.html">

        <ul class="navbar-nav me-auto">
            <li class="nav-item">
                <a class="nav-link" href="index.html"><strong>HOME</strong></a>

        </ul>

    <main class="dashboard-admin">
        <section class="admin-main-content">
            <div class="table-container-card">
                <div class="table-header-flex">
                    <div>
                        <h2>Gestión de Cuentas de Usuario</h2>
                        <p>Visualiza, edita nombres, cambia roles de acceso o elimina registros del sistema.</p>
                    </div>
                </div>

                <div class="table-responsive-admin">
                    <table class="table-usuarios">
                        <thead>
                            <tr>
                                <th>RUN</th>
                                <th>Nombre</th>
                                <th>Apellido</th>
                                <th>Correo</th>
                                <th>Rol en Plataforma</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="listaUsuariosBody">

                        </tbody>
                    </table>
                </div>
            </div>
        </section>
        <aside class="admin-profile-card">
            <div class="profile-avatar">
                <i class="bi bi-person-badge"></i>
            </div>
            <h4 id="adminNombre">Cargando...</h4>
            <span class="badge-role" id="adminRol">Rol</span>
            <p id="adminCorreo" class="profile-email">correo@ejemplo.com</p>
            <button id="btnCerrarSesion" class="btn-gold">Cerrar Sesión</button>
        </aside>
    </main>

    <script src="js/admin-home.js"></script>
