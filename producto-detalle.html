<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Producto - UrbanStyle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <header>
        <h1 class="text-center my-3 fw-bold">URBANSTYLE</h1>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">URBANSTYLE</a>
                <div class="ms-auto">
                    <a class="btn btn-outline-light px-3" href="carrito.html">Carrito (<span id="cart-counter">0</span>)</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5 flex-grow-1" id="detalle-container">
        <!-- Contenido renderizado por URL parámetros -->
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="m-0">UrbanStyle Boutique &copy; 2026</p>
    </footer>

    <script src="assets/js/productos-data.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            const id = parseInt(params.get("id"));
            const producto = PRODUCTOS.find(p => p.id === id);
            const container = document.getElementById("detalle-container");

            if (!producto) {
                container.innerHTML = `<h3 class="text-center">Producto no encontrado. <a href="productos.html">Volver al catálogo</a></h3>`;
                return;
            }

            container.innerHTML = `
                <div class="card border-0 shadow-sm p-4">
                    <div class="row g-4 align-items-center">
                        <div class="col-md-6">
                            <img src="${producto.imagen}" class="img-fluid rounded" alt="${producto.nombre}" style="width: 100%; max-height: 450px; object-fit: cover;">
                        </div>
                        <div class="col-md-6">
                            <span class="badge bg-dark mb-2">${producto.categoria.toUpperCase()}</span>
                            <h2 class="fw-bold mb-3">${producto.nombre}</h2>
                            <h3 class="text-primary fw-bold mb-3">$${producto.precio.toLocaleString("es-CL")}</h3>
                            <p class="text-muted mb-4">${producto.descripcion}</p>
                            
                            <div class="d-flex gap-3 align-items-center">
                                <button onclick="agregarAlCarrito(${producto.id})" class="btn btn-dark btn-lg px-4">Agregar al Carrito</button>
                                <a href="productos.html" class="btn btn-outline-secondary btn-lg">Volver</a>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            const carrito = JSON.parse(localStorage.getItem("carrito_urbanstyle")) || [];
            document.getElementById("cart-counter").textContent = carrito.reduce((sum, item) => sum + item.cantidad, 0);
        });

        function agregarAlCarrito(idProducto) {
            let carrito = JSON.parse(localStorage.getItem("carrito_urbanstyle")) || [];
            const itemExistente = carrito.find(item => item.id === idProducto);

            if (itemExistente) {
                itemExistente.cantidad++;
            } else {
                const productoBase = PRODUCTOS.find(p => p.id === idProducto);
                if (productoBase) carrito.push({ ...productoBase, cantidad: 1 });
            }

            localStorage.setItem("carrito_urbanstyle", JSON.stringify(carrito));
            document.getElementById("cart-counter").textContent = carrito.reduce((sum, item) => sum + item.cantidad, 0);
            alert("¡Producto añadido al carrito!");
        }
    </script>
</body>
</html>
