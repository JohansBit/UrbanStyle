<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>UrbanStyle Detalle Producto</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"><!--conecta con boostrap-->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"><!-- se conecta con los iconos de boostrap-->
        <meta name="viewport" content="width=device-width, initial-scale=1"><!-- Hace que la página se adapte al ancho de la pantalla del dispositivo (responsive) -->
        <link rel="icon" type="image/png" href="img/favicon.png">
        <link rel="stylesheet" href="css/styles.css">
    </head>
        
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid justify-content-start"><!-- Usa todo el ancho disponible y coloca los elementos desde el comienzo del contenedor -->
                <a class="navbar-brand" href="index.html">
                    <img src="img/logo.png" alt="UrbanStyle" width="100" height="50">
                </a>
                
                <ul class="navbar-nav me-auto"><!-- Contiene los elementos del menú de navegación y los alinea a la izquierda -->
                    <li class="nav-item">
                        <a class="nav-link" href="index.html"><strong>HOME</strong> </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="nosotros.html"><strong>NOSOTROS</strong></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="productos.html"><strong>PRODUCTOS</strong></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="blogs.html"><strong>BLOGS</strong></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contacto.html"><strong>CONTACTO</strong></a>
                    </li>
                </ul>

                <ul class="navbar-nav ">
                    <li class="nav-item"><a class="nav-link" href="login.html" aria-label="Iniciar sesión" title="Iniciar Seción"><i class="bi bi-door-open"></i></a></li>
                    <li class="nav-item"><a class="nav-link" href="carrito.html" aria-label="Carrito de Compras" title="Carrito de Compras"><i class="bi bi-cart"></i></a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="container my-5 flex-grow-1" id="detalle-container">
        <!-- Contenido renderizado por URL parámetros -->
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="m-0">UrbanStyle Boutique &copy; 2026</p>
    </footer>

    <script src="assets/js/productos-data.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            const id = parseInt(params.get("id"));
            const producto = PRODUCTOS.find(p => p.id === id);
            const container = document.getElementById("detalle-container");

            if (!producto) {
                container.innerHTML = `<h3 class="text-center">Producto no encontrado. <a href="productos.html">Volver al catálogo</a></h3>`;
                return;
            }

            container.innerHTML = `
                <div class="card border-0 shadow-sm p-4">
                    <div class="row g-4 align-items-center">
                        <div class="col-md-6">
                            <img src="${producto.imagen}" class="img-fluid rounded" alt="${producto.nombre}" style="width: 100%; max-height: 450px; object-fit: cover;">
                        </div>
                        <div class="col-md-6">
                            <span class="badge bg-dark mb-2">${producto.categoria.toUpperCase()}</span>
                            <h2 class="fw-bold mb-3">${producto.nombre}</h2>
                            <h3 class="text-primary fw-bold mb-3">$${producto.precio.toLocaleString("es-CL")}</h3>
                            <p class="text-muted mb-4">${producto.descripcion}</p>
                            
                            <div class="d-flex gap-3 align-items-center">
                                <button onclick="agregarAlCarrito(${producto.id})" class="btn btn-dark btn-lg px-4">Agregar al Carrito</button>
                                <a href="productos.html" class="btn btn-outline-secondary btn-lg">Volver</a>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            const carrito = JSON.parse(localStorage.getItem("carrito_urbanstyle")) || [];
            document.getElementById("cart-counter").textContent = carrito.reduce((sum, item) => sum + item.cantidad, 0);
        });

        function agregarAlCarrito(idProducto) {
            let carrito = JSON.parse(localStorage.getItem("carrito_urbanstyle")) || [];
            const itemExistente = carrito.find(item => item.id === idProducto);

            if (itemExistente) {
                itemExistente.cantidad++;
            } else {
                const productoBase = PRODUCTOS.find(p => p.id === idProducto);
                if (productoBase) carrito.push({ ...productoBase, cantidad: 1 });
            }

            localStorage.setItem("carrito_urbanstyle", JSON.stringify(carrito));
            document.getElementById("cart-counter").textContent = carrito.reduce((sum, item) => sum + item.cantidad, 0);
            alert("¡Producto añadido al carrito!");
        }
    </script>
    <script src="js/productos-data.js"></script>

</body>
</html>
