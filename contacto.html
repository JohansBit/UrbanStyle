<<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - UrbanStyle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/png" href="img/favicon.png">
</head>
<body class="d-flex flex-column min-vh-100">

    
    <header>
        <h1 class="text-center my-3 fw-bold text-gold">URBANSTYLE</h1>
        <nav class="navbar navbar-expand-lg border-bottom" style="background-color: #000; border-color: var(--color-purple) !important;">
            <div class="container">
                <a class="navbar-brand fw-bold text-gold" href="index.html">URBANSTYLE</a>
                <button class="navbar-toggler navbar-dark" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                    <ul class="navbar-nav gap-3">
                        <li class="nav-item"><a class="nav-link text-white" href="index.html">HOME</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="productos.html">PRODUCTOS</a></li>
                        <li class="nav-item"><a class="nav-link active text-gold fw-bold" href="contacto.html">CONTACTO</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="carrito.html">CARRITO</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    
    <main class="container my-5 flex-grow-1">
        <div class="row g-4 align-items-center">
            
           
            <div class="col-lg-6">
                <section class="auth-card">
                    <h2 class="text-center fw-bold mb-4 text-gold">Soporte & Consultas</h2>
                    
                    <form id="contactoForm" novalidate>
                        <div class="form-group mb-3">
                            <label for="nombre" class="form-label text-light">Nombre Completo:</label>
                            <input type="text" id="nombre" class="form-control" placeholder="Ej: Juan Pérez" required>
                            <div class="invalid-feedback">Por favor ingresa un nombre válido (mínimo 3 caracteres).</div>
                        </div>

                        <div class="form-group mb-3">
                            <label for="correo" class="form-label text-light">Correo Electrónico:</label>
                            <input type="email" id="correo" class="form-control" placeholder="nombre@correo.com" required>
                            <div class="invalid-feedback">Ingresa un correo electrónico válido.</div>
                        </div>

                        <div class="form-group mb-4">
                            <label for="comentario" class="form-label text-light">Mensaje o Comentario:</label>
                            <textarea id="comentario" class="form-control" rows="4" placeholder="Escribe tu consulta sobre productos o envíos..." required minlength="10"></textarea>
                            <div class="invalid-feedback">El comentario debe tener al menos 10 caracteres.</div>
                        </div>

                        <button type="submit" class="btn-gold">Enviar Mensaje</button>
                    </form>
                </section>
            </div>

            
            <div class="col-lg-6 text-center">
                <img src="img/airmax.jpg" 
                     onerror="this.src='https://images.unsplash.com/photo-1584735935682-2f2b69dff9d2?auto=format&fit=crop&w=800&q=80'" 
                     alt="UrbanStyle Sneakers" 
                     class="img-fluid rounded" 
                     style="border: 2px solid var(--color-purple); max-height: 480px; width: 100%; object-fit: cover; box-shadow: 0 0 15px rgba(142, 36, 170, 0.5);">
            </div>

        </div>
    </main>
    <footer class="text-center py-3 mt-auto border-top" style="background-color: var(--bg-card); border-color: #333 !important;">
        <p class="m-0" style="color: var(--text-muted);">UrbanStyle Boutique &copy; 2026</p>
    </footer>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/contacto.js"></script>
</body>
</html>
