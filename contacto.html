<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - UrbanStyle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <header>
        <h1 class="text-center my-3 fw-bold">URBANSTYLE</h1>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">URBANSTYLE</a>
                <div class="collapse navbar-collapse justify-content-center">
                    <ul class="navbar-nav gap-2">
                        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="productos.html">Catálogo</a></li>
                        <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5 flex-grow-1">
        <section class="card p-4 mx-auto shadow-sm" style="max-width: 600px;">
            <h2 class="text-center fw-bold mb-4">Soporte & Consultas</h2>
            
            <form id="contactoForm" novalidate>
                <div class="mb-3">
                    <label for="nombre" class="form-label fw-bold">Nombre Completo:</label>
                    <input type="text" id="nombre" class="form-control" placeholder="Ej: Juan Pérez" required>
                    <div class="invalid-feedback">Por favor ingresa un nombre válido (mínimo 3 caracteres).</div>
                </div>

                <div class="mb-3">
                    <label for="correo" class="form-label fw-bold">Correo Electrónico:</label>
                    <input type="email" id="correo" class="form-control" placeholder="nombre@correo.com" required>
                    <div class="invalid-feedback">Ingresa un correo electrónico válido.</div>
                </div>

                <div class="mb-3">
                    <label for="comentario" class="form-label fw-bold">Mensaje o Comentario:</label>
                    <textarea id="comentario" class="form-control" rows="4" placeholder="Escribe tu consulta sobre productos o envíos..." required minlength="10"></textarea>
                    <div class="invalid-feedback">El comentario debe tener al menos 10 caracteres.</div>
                </div>

                <button type="submit" class="btn btn-dark w-100 fw-bold py-2">Enviar Mensaje</button>
            </form>
        </section>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="m-0">UrbanStyle Boutique &copy; 2026</p>
    </footer>

    <script src="assets/js/contacto.js"></script>
</body>
</html>
