<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - UrbanStyle</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .auth-card {
            background-color: #18181c;
            border: 1px solid #6a1b9a;
            border-radius: 8px;
            padding: 30px;
        }
        .form-control {
            background-color: #0f0f12 !important;
            border: 1px solid #333 !important;
            color: #ffffff !important;
        }
        .form-control:focus {
            border-color: #d4af37 !important;
            box-shadow: 0 0 5px rgba(212, 175, 55, 0.5) !important;
        }
        .text-gold {
            color: #d4af37 !important;
        }
        .btn-gold {
            background-color: #d4af37;
            color: #000000;
            font-weight: bold;
            border: none;
            padding: 10px;
            border-radius: 5px;
            width: 100%;
            transition: 0.3s;
        }
        .btn-gold:hover {
            background-color: #f1c40f;
            color: #000;
        }
        .error-message {
            color: #ff6b6b;
            font-size: 0.85rem;
            display: none;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100" style="background-color: #0f0f12; color: #ffffff;">

    <!-- HEADER / NAVBAR -->
    <header>
        <h1 class="text-center my-3 fw-bold text-gold">URBANSTYLE</h1>
        <nav class="navbar navbar-expand-lg border-bottom" style="background-color: #000; border-color: #6a1b9a !important;">
            <div class="container">
                <a class="navbar-brand fw-bold text-gold" href="index.html">URBANSTYLE</a>
                <button class="navbar-toggler navbar-dark" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                    <ul class="navbar-nav gap-3">
                        <li class="nav-item"><a class="nav-link text-white" href="index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="productos.html">Catálogo</a></li>
                        <li class="nav-item"><a class="nav-link active text-gold fw-bold" href="contacto.html">Contacto</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="carrito.html">Carrito</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- MAIN CONTACTO (LAYOUT EN 2 COLUMNAS) -->
    <main class="container my-5 flex-grow-1">
        <div class="row g-4 align-items-center">
            
            <!-- COLUMNA IZQUIERDA: FORMULARIO -->
            <div class="col-lg-6">
                <section class="auth-card">
                    <h2 class="text-center fw-bold mb-4 text-gold">Soporte & Consultas</h2>
                    
                    <form id="contactoForm" novalidate>
                        <div class="form-group mb-3">
                            <label for="nombre" class="form-label text-light">Nombre Completo:</label>
                            <input type="text" id="nombre" class="form-control" placeholder="Ej: Juan Pérez" required>
                            <span class="error-message" id="err-nombre">Por favor ingresa un nombre válido (mínimo 3 caracteres).</span>
                        </div>

                        <div class="form-group mb-3">
                            <label for="correo" class="form-label text-light">Correo Electrónico:</label>
                            <input type="email" id="correo" class="form-control" placeholder="nombre@correo.com" required>
                            <span class="error-message" id="err-correo">Ingresa un correo electrónico válido.</span>
                        </div>

                        <div class="form-group mb-4">
                            <label for="comentario" class="form-label text-light">Mensaje o Comentario:</label>
                            <textarea id="comentario" class="form-control" rows="4" placeholder="Escribe tu consulta sobre productos o envíos..." required minlength="10"></textarea>
                            <span class="error-message" id="err-comentario">El comentario debe tener al menos 10 caracteres.</span>
                        </div>

                        <button type="submit" class="btn-gold">Enviar Mensaje</button>
                    </form>
                </section>
            </div>

            <!-- COLUMNA DERECHA: IMAGEN CON MARCO MORADO -->
            <div class="col-lg-6 text-center">
                <img src="contactotienda.jpg" 
                     onerror="this.src='https://images.unsplash.com/photo-1584735935682-2f2b69dff9d2?auto=format&fit=crop&w=800&q=80'" 
                     alt="UrbanStyle Sneakers" 
                     class="img-fluid rounded" 
                     style="border: 2px solid #6a1b9a; max-height: 480px; width: 100%; object-fit: cover; box-shadow: 0 0 15px rgba(106, 27, 154, 0.5);">
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="text-center py-3 mt-auto border-top" style="background-color: #18181c; border-color: #333 !important;">
        <p class="m-0" style="color: #a0a0a0;">UrbanStyle Boutique &copy; 2026</p>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="contacto.js"></script>
</body>
</html>
