        <div class="auth-container">
                <section class="auth-card">
                 
                <h2>Registrarse</h2>
                <form id="registroForm" action="" method="post">
                    <div class="form-group"> 
                        <label for="username">Nombre</label> 
                        <input type="text" class="form-control" name="nombre" id="username" maxlength="50" placeholder="Ej: John" required> 
                    </div>
                     <div class="form-group"> 
                        <label for="lastname">Apellido</label> 
                        <input type="text" class="form-control" name="apellido" id="lastname" maxlength="100" placeholder="Ej: Doe" required> 
                    </div>
                     <div class="form-group"> 
                        <label for="run">RUN</label> 
                        <input type="text" class="form-control" name="RUN" id="run" minlength="7" maxlength="9" placeholder="Ej: 12345678k" required> 
                    </div>
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" class="form-control" name="correo" id="email" maxlength="100" placeholder="johndoe1@urbanstyle.com" required>
                    </div>    
                     <div class="form-group"> 
                        <label for="fnacimiento">Fecha de Nacimiento (opcional)</label> 
                        <input type="date" class="form-control" name="fnacimiento" id="fnacimiento"> 
                    </div>
                    <div class="form-group"> 
                        <label for="password">Contraseña</label>  
                        <input type="password" class="form-control" name="contrasena" id="password"  minlength="4" maxlength="10" placeholder="Contraseña" required>
                    </div>
                    <div class="form-group"> 
                        <label for="Vpassword"> Confirma la contraseña</label>  
                        <input type="password" class="form-control" name="confirmarContrasena" id="Vpassword" minlength="4" maxlength="10" placeholder="Confirma la Contraseña" required>
                    </div>
                    <div class="form-group"> 
                        <label for="direccion">Direccion</label> 
                        <input type="text" class="form-control" name="direccion" id="direccion" placeholder="Av Siempre viva 12573" required> 
                    </div>
                    <div class="form-group"> 
                        <label for="region">Region</label> 
                        <select class="form-control" id="region" name="region" required >
                            <option value="">--Seleccione una Region--</option>
                        </select> 
                    </div>
                    <div class="form-group"> 
                        <label for="comuna">Comuna</label> 
                        <select class="form-control" id="comuna" name="comuna" required disabled>
                            <option value="">--Seleccione una Comuna--</option>
                        </select> 
                    </div>
                    <button class="btn-gold" type="submit">Registrarse</button>
                    <p>¿Ya tienes una cuenta?</p>
                    <a href="login.html" class="text-link">Inicia Sesión</a>
                </form>
            </section>
