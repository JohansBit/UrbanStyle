        <section class="categoria-seccion">
            <div class="categoria-header">
                <h3>Poleras & Polerones</h3>
                <a href="admin-form-prod.html?cat=poleras" class="btn-gold"> +Nueva Prenda</a>

            </div>
            <ul class="producto-slider">
                <li class="producto-card">
                    <a href="admin-form-prod.html?sku=POL-001" class="prod-img-link">
                        <img src="img/prod/polera-black.webp" alt="Polera Oversized Black" onerror="this.src=img/placeholder.png">

                    <div class="prod-info">
                        <span class="prod-sku">POL-001</span>

                    <div class="stock-control">
                        <button type="button" class="btn-stock" onclick="modificarStock('POL-001', -1)">-</button>

                        <button type="button" class="btn-stock" onclick="modificarStock('POL-001', +1)">+</button>
                    </div>
                    <a href="admin-form-prod.html?sku=POL-001" class="btn-edit-link">
                        Editar Detalles
                    </a>
