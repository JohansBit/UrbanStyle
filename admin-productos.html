<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos - Admin UrbanStyle</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/png" href="img/favicon.png">
</head>
<body>
    <nav class="navbar">
        <a class="navbar-brand" href="index.html">
            <img src="img/logo.png" alt="UrbanStyle" class="logo">
        </a>
        
        <ul class="navbar-nav me-auto">
            <li class="nav-item">
                <a class="nav-link" href="index.html"><strong>HOME</strong></a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="nosotros.html"><strong>NOSOTROS</strong></a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="productos.html"><strong>PRODUCTOS</strong></a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="blogs.html"><strong>BLOGS</strong></a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="contacto.html"><strong>CONTACTO</strong></a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="admin-home.html"><strong>ADMIN-HOME</strong></a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="admin-usuarios.html"><strong>ADMIN-USUARIOS</strong></a>
            </li>
        </ul>
    </nav>    

    <main class="container my-4" style="max-width: 1200px; margin: 0 auto; padding: 0 15px;">
        
        <!-- 1. POLERAS & POLERONES -->
        <section class="categoria-seccion">
            <div class="categoria-header">
                <h3>Poleras & Polerones</h3>
                <a href="admin-form-prod.html?cat=POL" class="btn-gold" style="width: auto;">+ Nueva Prenda</a>
            </div>
            <ul class="producto-slider" id="slider-POL"></ul>
        </section>

        <!-- 2. PANTALONES -->
        <section class="categoria-seccion">
            <div class="categoria-header">
                <h3>Pantalones</h3>
                <a href="admin-form-prod.html?cat=PANT" class="btn-gold" style="width: auto;">+ Nueva Prenda</a>
            </div>
            <ul class="producto-slider" id="slider-PANT"></ul>
        </section>

        <!-- 3. ZAPATILLAS -->
        <section class="categoria-seccion">
            <div class="categoria-header">
                <h3>Zapatillas</h3>
                <a href="admin-form-prod.html?cat=ZAPT" class="btn-gold" style="width: auto;">+ Nueva Prenda</a>
            </div>
            <ul class="producto-slider" id="slider-ZAPT"></ul>
        </section>

        <!-- 4. ACCESORIOS -->
        <section class="categoria-seccion">
            <div class="categoria-header">
                <h3>Accesorios</h3>
                <a href="admin-form-prod.html?cat=ACCS" class="btn-gold" style="width: auto;">+ Nueva Prenda</a>
            </div>
            <ul class="producto-slider" id="slider-ACCS"></ul>
        </section>

    </main>

    <script src="js/productos-data.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            cargarProductosAdmin();
        });

        function cargarProductosAdmin() {
            const productos = obtenerProductos();
            const configCategorias = [
                { id: "POL", matches: ["POL", "POLERAS", "POLERAS-POLERONES"] },
                { id: "PANT", matches: ["PANT", "PANTALONES"] },
                { id: "ZAPT", matches: ["ZAPT", "ZAPATILLAS"] },
                { id: "ACCS", matches: ["ACCS", "ACCESORIOS"] }
            ];

            configCategorias.forEach(cat => {
                const slider = document.getElementById(`slider-${cat.id}`);
                if (!slider) return;
                slider.innerHTML = "";

                const filtrados = productos.filter(p => {
                    const catProd = (p.categoria || "").toUpperCase();
                    return cat.matches.includes(catProd);
                });

                if (filtrados.length === 0) {
                    slider.innerHTML = "<p style='color:#888; padding: 15px;'>No hay productos en esta categoría.</p>";
                    return;
                }

                filtrados.forEach(prod => {
                    const li = document.createElement("li");
                    li.className = "producto-card";
                    li.innerHTML = `
                        <a href="admin-form-prod.html?sku=${prod.codigo}" class="prod-img-link">
                            <img src="${prod.imagen}" alt="${prod.nombre}" onerror="this.onerror=null; this.src='https://placehold.co/600x400/1e1e1e/d4af37?text=UrbanStyle';">
                        </a>
                        <div class="prod-info">
                            <span class="prod-sku">${prod.codigo}</span>
                            <a href="admin-form-prod.html?sku=${prod.codigo}" class="prod-titulo">${prod.nombre}</a>
                            <p class="prod-precio">$${prod.precio.toLocaleString("es-CL")}</p>
                        </div>
                        <div class="stock-control">
                            <button type="button" class="btn-stock" onclick="modificarStock('${prod.codigo}', -1)">-</button>
                            <span class="stock-actual" id="stock-${prod.codigo}">${prod.stock}</span>
                            <button type="button" class="btn-stock" onclick="modificarStock('${prod.codigo}', 1)">+</button>
                        </div>
                        <a href="admin-form-prod.html?sku=${prod.codigo}" class="btn-edit-link">
                            Editar Detalles
                        </a>
                    `;
                    slider.appendChild(li);
                });
            });
        }

        function modificarStock(sku, cambio) {
            const productos = obtenerProductos();
            const prod = productos.find(p => p.codigo.toUpperCase() === sku.toUpperCase());
            if (!prod) return;

            const nuevoStock = prod.stock + cambio;
            if (nuevoStock < 0) return;

            prod.stock = nuevoStock;
            guardarProductos(productos);

            const span = document.getElementById(`stock-${sku}`);
            if (span) span.textContent = nuevoStock;

            if (prod.stockCritico && prod.stock <= prod.stockCritico) {
                alert(`¡Atención! El stock del producto ${prod.nombre} (${prod.codigo}) ha alcanzado su nivel crítico (${prod.stock} unidades).`);
            }
        }
    </script>
</body>
</html>
