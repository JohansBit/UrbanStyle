        <div class="auth-container">
                <section class="auth-card">
                 
                <h2>Iniciar Sesión</h2>
                <form id="loginForm" action="" method="post">
                    <div class="form-group"> 
                        <label for="correo">Correo Electrónico</label> 
                        <input class="form-control" name="correo" id="loginEmail"  type="text" placeholder="Johndoe1@duoc.cl" required> 
                    </div>    
                    <div class="form-group"> 
                        <label for="password">Contraseña</label>  
                        <input class="form-control" name="pass" id="loginPass" placeholder="Contraseña" required>
                    </div>
                    <p id="errorLogin" class="error-mensaje" style="display: none; text-align: center; margin-bottom: 15px;">
                        Credenciales Inválidas
                    </p>
                    <button type="submit" class="btn-gold" type="submit">Ingresar</button>
                    <p>¿No tienes una cuenta?</p>
