<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras - UrbanStyle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/png" href="img/favicon.png">
</head>
<body class="d-flex flex-column min-vh-100">

    
    <header>
        <h1 class="text-center my-3 fw-bold text-gold" style="letter-spacing: 1px;">URBANSTYLE</h1>
        <nav class="navbar navbar-expand-lg border-bottom" style="background-color: #000; border-color: var(--color-purple) !important;">
            <div class="container">
                <a class="navbar-brand fw-bold text-gold" href="index.html">URBANSTYLE</a>
                <button class="navbar-toggler navbar-dark" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                    <ul class="navbar-nav gap-2 align-items-center">
                        <li class="nav-item"><a class="nav-link text-white" href="index.html">HOME</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="productos.html">PRODUCTOS</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="contacto.html">CONTACTO</a></li>
                        <li class="nav-item">
                            <a class="nav-link btn px-3 ms-lg-3 text-dark fw-bold text-decoration-none btn-gold" href="carrito.html">
                                CARRITO (<span id="cart-counter">0</span>)
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    
    <main class="container my-5 flex-grow-1">
        <h2 class="fw-bold mb-4 text-gold text-uppercase">Carrito de Compras</h2>

        <div class="row g-4">
            
            <div class="col-lg-8">
                <div class="cart-card table-responsive">
                    <table class="table table-custom align-middle m-0">
                        <thead>
                            <tr>
                                <th>Producto</th>
                                <th>Precio</th>
                                <th class="text-center">Cantidad</th>
                                <th>Subtotal</th>
                                <th class="text-end">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-carrito">
                           
                        </tbody>
                    </table>
                </div>
            </div>

           
            <div class="col-lg-4">
                <div class="cart-card">
                    <h4 class="fw-bold mb-3 text-gold">Resumen del Pedido</h4>
                    <hr style="border-color: var(--color-purple);">
                    
                    <div class="d-flex justify-content-between align-items-center fs-5 fw-bold mb-4">
                        <span>Total:</span>
                        <span id="total-precio" class="text-gold fs-4">$0</span>
                    </div>

                    <button onclick="procesarCompra()" class="btn-gold w-100">Ir al Pago / Checkout</button>
                    
                    <div class="mt-3 text-center">
                        <a href="productos.html" class="text-decoration-none text-light opacity-75">
                            ← Seguir comprando
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    
    <footer class="text-center py-3 mt-auto border-top" style="background-color: var(--bg-card); border-color: var(--border-color, #333) !important;">
        <p class="m-0" style="color: var(--text-muted);">UrbanStyle Boutique &copy; 2026</p>
    </footer>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/productos-data.js"></script>
    <script src="js/carrito.js"></script>
</body>
</html>
