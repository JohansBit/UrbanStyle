<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras - UrbanStyle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <header>
        <h1 class="text-center my-3 fw-bold">URBANSTYLE</h1>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">URBANSTYLE</a>
                <a class="btn btn-outline-light" href="productos.html">Seguir Comprando</a>
            </div>
        </nav>
    </header>

    <main class="container my-5 flex-grow-1">
        <h2 class="fw-bold mb-4">CARRITO DE COMPRAS</h2>

        <div class="row g-4">
            <div class="col-lg-8">
                <div class="table-responsive bg-white shadow-sm rounded p-3">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th>Producto</th>
                                <th>Precio</th>
                                <th>Cantidad</th>
                                <th>Subtotal</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-carrito">
                            <!-- Renderizado JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card border-0 shadow-sm p-4">
                    <h4 class="fw-bold mb-3">Resumen del Pedido</h4>
                    <hr>
                    <div class="d-flex justify-content-between fs-5 fw-bold mb-4">
                        <span>Total:</span>
                        <span id="total-precio">$0</span>
                    </div>
                    <button onclick="procesarCompra()" class="btn btn-dark w-100 btn-lg fw-bold">Ir al Pago / Checkout</button>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="m-0">UrbanStyle Boutique &copy; 2026</p>
    </footer>

    <script src="assets/js/carrito.js"></script>
</body>
</html>
