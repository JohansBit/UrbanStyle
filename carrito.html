<!DOCTYPE html>
<html lang="es">
<head>
        <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Carrito de Compras</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"><!--conecta con boostrap-->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" type="image/png" href="img/favicon.png">
        <link rel="stylesheet" href="css/styles.css">
    </head>
<body>

    <header>
        <nav class="navbar">
            <div class="container-fluid justify-content-start">
                <a class="navbar-brand" href="index.html">
                    <img src="img/logo.png" alt="UrbanStyle" class="logo">
                </a>
                
                <ul class="navbar-nav me-auto nav-link">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html"><strong>HOME</strong> </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="nosotros.html"><strong>NOSOTROS</strong></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="productos.html"><strong>PRODUCTOS</strong></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="blogs.html"><strong>BLOGS</strong></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contacto.html"><strong>CONTACTO</strong></a>
                    </li>
                </ul>
                
                <ul class="d-flex align-items-end gap-3 list-unstyled" style="color: var(--text -main);">

                    <li  class="nav-item" id="nav-usuario">
                        <a class="nav-link" href="login.html" aria-label="Iniciar Sesion" title="Iniciar Sesion">
                            <i class="bi bi-door-open" style="font-size: 2.6rem;"></i>
                        </a>
                    </li>


                    <li>
                        <a href="carrito.html" class="nav-link text-decoration-none" aria-label="Carrito" title="Carrito">
                            <i class="bi bi-cart" style="font-size : 2.6rem"></i>
                        </a>
                    </li>
                </ul>

            
            </div>
        </nav>
    </header>

    <main class="container my-5 flex-grow-1">
        <h2 class="fw-bold mb-4">CARRITO DE COMPRAS</h2>

        <div class="row g-4">
            <div class="col-lg-8">
                <div class="table-responsive bg-white shadow-sm rounded p-3">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th>Producto</th>
                                <th>Precio</th>
                                <th>Cantidad</th>
                                <th>Subtotal</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-carrito">
                            <!-- Renderizado JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card border-0 shadow-sm p-4">
                    <h4 class="fw-bold mb-3">Resumen del Pedido</h4>
                    <hr>
                    <div class="d-flex justify-content-between fs-5 fw-bold mb-4">
                        <span>Total:</span>
                        <span id="total-precio">$0</span>
                    </div>
                    <button onclick="procesarCompra()" class="btn btn-dark w-100 btn-lg fw-bold">Ir al Pago / Checkout</button>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="m-0">UrbanStyle Boutique &copy; 2026</p>
    </footer>

    <script src="assets/js/carrito.js"></script>
